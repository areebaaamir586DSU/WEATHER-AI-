*{margin:0;padding:0;box-sizing:border-box}

#root{position:relative;z-index:1}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:10px}
.gs{background:rgba(17,24,39,.85);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.08)}
.gc{background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:20px;transition:all .4s cubic-bezier(.4,0,.2,1)}
.gc:hover{border-color:rgba(255,255,255,.12);transform:translateY(-2px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.cd{background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:24px;transition:all .4s}
.cd:hover{border-color:rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sc{background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:24px;position:relative;overflow:hidden;transition:all .4s}
.sc:hover{transform:translateY(-4px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.bd{display:inline-flex;align-items:center;padding:4px 12px;border-radius:100px;font-size:11px;font-weight:700;text-transform:uppercase}
.bd-low{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.2)}
.bd-medium{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.2)}
.bd-high{background:rgba(249,115,22,.15);color:#fb923c;border:1px solid rgba(249,115,22,.2)}
.bd-critical{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2);animation:pc 2s infinite}
.gt{background:linear-gradient(135deg,#10b981,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pd{width:8px;height:8px;border-radius:50%;background:#10b981;position:relative}
.pd::after{content:'';position:absolute;inset:-4px;border-radius:50%;background:rgba(16,185,129,.4);animation:pr 2s infinite}
.leaflet-container{width:100%;height:100%;border-radius:16px;background:#0f172a}
.leaflet-popup-content-wrapper{background:rgba(17,24,39,.95)!important;color:#f1f5f9!important;border:1px solid rgba(255,255,255,.08)!important;border-radius:16px!important}
.leaflet-tooltip{background:rgba(17,24,39,.95)!important;color:#f1f5f9!important;border:1px solid rgba(255,255,255,.08)!important;border-radius:12px!important}
@keyframes pr{0%{transform:scale(1);opacity:1}100%{transform:scale(2.5);opacity:0}}
@keyframes pc{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fu{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes si{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.af{animation:fl 4s ease-in-out infinite}
.afu{animation:fu .6s cubic-bezier(.4,0,.2,1) forwards}
.as{animation:si .4s cubic-bezier(.4,0,.2,1) forwards}
</style>
</head>

const S=[{id:1,n:"New York",la:40.78,lo:-73.96,r:"Northeast",c:"USA"},{id:2,n:"London",la:51.47,lo:-0.45,r:"Europe",c:"UK"},{id:3,n:"Tokyo",la:35.69,lo:139.69,r:"Asia Pacific",c:"Japan"},{id:4,n:"Sydney",la:-33.86,lo:151.22,r:"Oceania",c:"Australia"},{id:5,n:"Dubai",la:25.25,lo:55.37,r:"Middle East",c:"UAE"},{id:6,n:"Mumbai",la:19.08,lo:72.88,r:"South Asia",c:"India"},{id:7,n:"Sao Paulo",la:-23.55,lo:-46.63,r:"South America",c:"Brazil"},{id:8,n:"Cairo",la:30.04,lo:31.24,r:"Africa",c:"Egypt"},{id:9,n:"Moscow",la:55.76,lo:37.62,r:"Europe",c:"Russia"},{id:10,n:"Beijing",la:39.90,lo:116.41,r:"Asia Pacific",c:"China"},{id:11,n:"Paris",la:48.86,lo:2.35,r:"Europe",c:"France"},{id:12,n:"Los Angeles",la:34.05,lo:-118.24,r:"West Coast",c:"USA"},{id:13,n:"Singapore",la:1.28,lo:103.86,r:"Southeast Asia",c:"Singapore"},{id:14,n:"Berlin",la:52.52,lo:13.41,r:"Europe",c:"Germany"},{id:15,n:"Cape Town",la:-33.92,lo:18.42,r:"Africa",c:"South Africa"},{id:16,n:"Seoul",la:37.50,lo:127.04,r:"Asia Pacific",c:"South Korea"},{id:17,n:"Toronto",la:43.65,lo:-79.38,r:"North America",c:"Canada"},{id:18,n:"Mexico City",la:19.43,lo:-99.13,r:"North America",c:"Mexico"},{id:19,n:"Jakarta",la:-6.21,lo:106.85,r:"Southeast Asia",c:"Indonesia"},{id:20,n:"Bangkok",la:13.76,lo:100.50,r:"Southeast Asia",c:"Thailand"}];
